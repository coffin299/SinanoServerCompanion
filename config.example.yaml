# ============================================================
#  SinanoServerCompanion 設定ファイル
#  このファイルを config.yaml という名前でコピーして編集してください。
#  （start.bat の初回起動時は自動でコピーされます）
# ============================================================

# Discord Developer Portal で発行した Bot トークン
Botトークン: "ここにBotトークンを貼り付け"

# 対象サーバー（ギルド）の ID
サーバーID: 000000000000000000

# スラッシュコマンドと管理パネルを使えるユーザー ID（ホワイトリスト、1 人以上必須）
# ユーザー ID は開発者モードを有効にして、ユーザーを右クリック →「ユーザー ID をコピー」で取得できます
コマンドを使えるユーザーID:
  - 555555555555555555
  - 666666666666666666

# Bot のカスタムステータス（128 文字以内、空 "" で非表示）
カスタムステータス: "在校生を見守り中"

# Bot のオンライン状態（online / idle / dnd / invisible）
オンライン状態: online

# 進級祝い・入学祝いを送るチャンネル ID（0 で無効）
お祝い通知チャンネルID: 0

# 設定再読込・定期同期の結果・パネル設置を送るチャンネル ID（0 で無効）
システムログチャンネルID: 0

# 手動の一括操作（実行・中止）の結果を送るチャンネル ID（0 で無効）
一括操作ログチャンネルID: 0

# 進級のお祝いメッセージ（{name}=表示名 / {grade}=学年の数字 / {role}=ロールの表示名）
# メンションは飛びません。空 "" にすると送りません
お祝いメッセージ: "🎉 祝！{name}さんが{grade}年生になりました！"

# 新規加入時の入学祝いメッセージ（お祝い通知チャンネルに送信）
# {name}=表示名 / {server}=サーバー名 / {role}=付与した学年ロールの表示名
# 空 "" にすると送りません
入学祝いメッセージ: "🌸 祝！{name}さんが{server}に入学しました！ようこそ！"

# 参加記念日の判定に使うタイムゾーン
タイムゾーン: Asia/Tokyo

# true なら Bot アカウントにはロールを付けない
Botを対象外にする: true

# 学年ロールを自動で付け直す間隔（時間）。起動時にも 1 回実行。0 で無効
定期同期間隔(時間): 24

# 一括処理で 1 人のロールを変更するごとに待つ秒数（レート制限対策）
API操作間隔(秒): 1.0

# 一括処理中に管理パネルの進捗表示を更新する間隔（秒、2 以上）
進捗更新間隔(秒): 5

# 新規加入時に必ず付けるロール（「表示名: ロールID」、複数可・空でも可）
新規加入時必ず付けるロール:
  一般生徒: 111111111111111111

# サーバー参加年数ごとに付けるロール（上から 1 年目, 2 年目, ...）
#  - 書いた順番がそのまま学年になります
#  - 表示名は重複不可（同じ名前を 2 回書くとエラーになります）
#  - 最後のロールより長く在籍している人は最後のロールのままになります
サーバー参加年数ごとに付けるロール:
  一年生: 222222222222222222
  二年生: 333333333333333333
  三年生: 444444444444444444

# メンション応答（LLM）の設定
#  - Bot をメンションすると返信します。Bot の返信にメンション付きで返信すると会話が続きます
#  - 既定は NVIDIA NIM（https://build.nvidia.com）。OpenAI 互換 API なら URL とモデルを変えて使えます
LLM:
  # true でメンション応答を有効にする
  有効: false
  # NVIDIA NIM の API キー（nvapi- で始まる文字列）
  APIキー: ""
  # OpenAI 互換 API のベース URL
  APIのURL: https://integrate.api.nvidia.com/v1
  # 使うモデル名（Web検索を使うならツール呼び出し対応のモデルにする）
  #  - 複数書くと上から順に試し、エラー・廃止のときは次のモデルへ切り替える
  #  - 廃止（404 / 410）と判定したモデルは、設定を再読込するまで飛ばす
  #  - 1 つだけなら「モデル: meta/llama-3.3-70b-instruct」のように 1 行でも書ける
  モデル:
    - meta/llama-3.3-70b-instruct
    - meta/llama-3.1-70b-instruct
  # Bot の性格・口調などの指示（システムプロンプト）
  キャラクター設定: |
    あなたは Discord サーバーにいるフレンドリーなアシスタント Bot です。
    日本語で、簡潔かつ親しみやすく答えてください。Discord のマークダウンが使えます。
  # 応答のランダムさ（0〜2、低いほど堅実）
  温度: 0.7
  # 1 回の応答の最大トークン数
  最大トークン数: 1024
  # 返信チェーンを何件まで遡って文脈にするか（0 で遡らない）
  会話履歴の件数: 10
  # true なら必要に応じて DuckDuckGo でウェブ検索する
  Web検索: true
  # 1 回の検索で LLM に渡す結果の件数（1〜10）
  検索結果の件数: 5
  # 応答するチャンネル ID（空 [] なら全チャンネル。スレッドは親チャンネルの指定でも可）
  応答するチャンネルID: []
  # 同じ人が続けて話しかけられる間隔（秒、0 で制限なし）
  ユーザーごとの間隔(秒): 3
  # API の応答を待つ最大秒数（5 以上）
  タイムアウト(秒): 60
  # メンション直後にすぐ返信する待機中の文言（応答ができたらこのメッセージを書き換える）
  # 空 "" にすると出さない
  待機中メッセージ: "💭 考え中…"
